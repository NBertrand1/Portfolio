name: Refresh compatible dependencies

on:
  push:
    branches:
      - feature/quality-performance-lot3

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Update dependencies within declared semver ranges
        run: npm update --save

      - name: Audit dependencies (diagnostic)
        run: |
          npm audit --json > npm-audit.json || true
          node --input-type=module -e "
            import fs from 'node:fs';
            const audit = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
            console.log('Audit summary:', JSON.stringify(audit.metadata?.vulnerabilities ?? {}, null, 2));
            for (const [name, item] of Object.entries(audit.vulnerabilities ?? {})) {
              console.log(name + ': ' + item.severity + ' — ' + (item.fixAvailable ? 'fix available' : 'no safe fix reported'));
            }
          "

      - name: Run ESLint
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Commit verified dependency updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No compatible dependency updates available."
          else
            git commit -m "chore: update compatible dependencies"
            git push
          fi
