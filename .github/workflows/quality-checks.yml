name: Portfolio quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "ci/**"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Install Chromium for responsive smoke checks
        run: npx --yes playwright install chromium

      - name: Start Vite preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/portfolio-preview.log 2>&1 &
          echo $! > /tmp/portfolio-preview.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/portfolio-preview.log
          exit 1

      - name: Capture desktop and mobile renderings
        run: |
          mkdir -p artifacts
          npx --yes playwright screenshot --browser chromium --viewport-size="1440,1000" --full-page http://127.0.0.1:4173/ artifacts/desktop.png
          npx --yes playwright screenshot --browser chromium --viewport-size="390,844" --full-page http://127.0.0.1:4173/ artifacts/mobile.png

      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-responsive-checks
          path: artifacts/
          if-no-files-found: warn

      - name: Stop preview server
        if: always()
        run: |
          if [ -f /tmp/portfolio-preview.pid ]; then
            kill "$(cat /tmp/portfolio-preview.pid)" || true
          fi
